responses:
  utter_greet:
    - text: "Maayong buntag! Ako si SeniorGo, unsa man imong gusto buhaton karon?"
  utter_goodbye:
    - text: "Salamat sa imong oras! Amping pirmi."
  utter_ask_first_name:
    - text: "Unsa imong unang ngalan?"
  utter_ask_last_name:
    - text: "Unsa imong apelyido?"
  utter_ask_barangay:
    - text: "Asa ka nagpuyo nga barangay?"
  utter_submit_success:
    - text: "Salamat! Na-record na ang imong impormasyon. Ang OSCA mopadala ug update sa imong aplikasyon."
  utter_thank_you:
    - text: "Walay sapayan! Nalipay ko makatabang nimo."

